<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AbhiJob - Find Jobs, Internships &amp; Hire Top Talent</title>
    <meta
      name="description"
      content="AbhiJob is a placement management system that helps students and freshers find jobs and internships, and helps recruiters and companies hire top talent."
    />
    <meta name="author" content="Abhijeet Tiwari" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1E246D" />
    <link rel="canonical" href="https://abhijob-portal-app-olive.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="AbhiJob" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AbhiJob - Find Jobs, Internships &amp; Hire Top Talent" />
    <meta
      property="og:description"
      content="A placement management system connecting students, job seekers, recruiters, and companies."
    />
    <meta property="og:url" content="https://abhijob-portal-app-olive.vercel.app/" />
    <meta property="og:image" content="https://abhijob-portal-app-olive.vercel.app/web-app-manifest-512x512.png" />
    <meta property="og:image:alt" content="AbhiJob logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AbhiJob - Find Jobs, Internships &amp; Hire Top Talent" />
    <meta
      name="twitter:description"
      content="A placement management system connecting students, job seekers, recruiters, and companies."
    />
    <meta name="twitter:image" content="https://abhijob-portal-app-olive.vercel.app/web-app-manifest-512x512.png" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="AbhiJob" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Speed up the first connection to the hero image host -->
    <link rel="preconnect" href="https://imgs.search.brave.com" crossorigin />

    <!-- Sitewide structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://abhijob-portal-app-olive.vercel.app/#organization",
            "name": "AbhiJob",
            "url": "https://abhijob-portal-app-olive.vercel.app/",
            "logo": "https://abhijob-portal-app-olive.vercel.app/web-app-manifest-512x512.png",
            "email": "support@abhijob.com",
            "address": { "@type": "PostalAddress", "addressLocality": "Bangalore", "addressCountry": "IN" }
          },
          {
            "@type": "WebSite",
            "@id": "https://abhijob-portal-app-olive.vercel.app/#website",
            "name": "AbhiJob",
            "url": "https://abhijob-portal-app-olive.vercel.app/",
            "publisher": { "@id": "https://abhijob-portal-app-olive.vercel.app/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://abhijob-portal-app-olive.vercel.app/jobs?keyword={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>AbhiJob is a placement management system for students, recruiters and companies. Please enable JavaScript to use the app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
